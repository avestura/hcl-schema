name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./pkg)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # -race needs cgo and therefore a C toolchain. It is available on the
      # Linux and macOS runners; Windows runs the same tests without it.
      - name: Test
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...

  self-check:
    name: Validate this repository's own schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - run: go build -o hclschema ./cmd/hclschema-cli

      # The meta-schemas and the example must validate, and the schema
      # documents must already be in canonical form.
      - run: ./hclschema validate --format github --offline schema example.schema.hcl
      - run: ./hclschema fmt --check schema example.schema.hcl

  reference-docs:
    name: Generated reference is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate and diff
        run: |
          node website/scripts/gen-reference.js
          if ! git diff --quiet -- website/docs/reference; then
            echo "The generated reference is out of date. Run:"
            echo "  node website/scripts/gen-reference.js"
            git diff -- website/docs/reference
            exit 1
          fi

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: vsx/yarn.lock

      - run: yarn install --frozen-lockfile
        working-directory: vsx
      - run: yarn run compile
        working-directory: vsx
      - run: yarn run lint
        working-directory: vsx

      # A per-platform VSIX must carry exactly one binary. vsce runs
      # `vscode:prepublish` itself, so a hook that builds every target would
      # silently put all of them back into each package.
      - name: Package and check the contents
        working-directory: vsx
        run: |
          yarn run package
          vsix="$(ls dist/*.vsix)"
          echo "checking $vsix"
          list="${RUNNER_TEMP:-/tmp}/bundled-binaries.txt"
          unzip -Z1 "$vsix" 'extension/bin/*' > "$list" || true
          cat "$list"
          count="$(grep -c . "$list" || true)"
          if [ "$count" != "1" ]; then
            echo "expected exactly 1 bundled binary, found $count"
            exit 1
          fi
          size="$(stat -c%s "$vsix")"
          echo "size: $size bytes"
          # Comfortably above one binary plus the language client, and far
          # below the ~38 MB a package carrying every platform would reach.
          if [ "$size" -gt 12000000 ]; then
            echo "package is larger than expected; is something extra bundled?"
            exit 1
          fi

  website:
    name: Website builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: website/yarn.lock

      - run: yarn install --frozen-lockfile
        working-directory: website
      - run: yarn run build
        working-directory: website
